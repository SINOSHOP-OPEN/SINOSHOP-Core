name: Foundry Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Force install missing dependencies
        run: |
          if [ ! -f "lib/forge-std/src/Test.sol" ]; then
            echo "forge-std missing, installing..."
            rm -rf lib/forge-std
            forge install foundry-rs/forge-std --no-git
          fi
          if [ ! -d "lib/openzeppelin-contracts/contracts" ]; then
            echo "openzeppelin-contracts missing, installing..."
            rm -rf lib/openzeppelin-contracts
            forge install OpenZeppelin/openzeppelin-contracts --no-git
          fi
          forge remappings > remappings.txt

      - name: Run tests
        run: forge test --match-path 'test/**/*.t.sol' -vvv --gas-report
